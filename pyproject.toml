[project]
name = "icd-coder"
version = "0.1.0"
description = "Proposes ICD-11 MMS codes for outpatient consult notes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "scipy>=1.18.1",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
icd-coder = "icd_coder.cli:main"
icd-coder-prepare = "icd_coder.cli:prepare"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icd_coder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PTH", "PL", "PT", "RUF", "TID", "ERA", "BLE", "LOG",
]
ignore = ["PLR2004", "PLR0913", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["snowballstemmer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
